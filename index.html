<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just a Question 💭</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #ffd6e7, #ffeaf4);
    overflow: hidden;
}

/* GENERAL */
.container {
    margin-top: 60px;
}

.hidden {
    display: none;
}

/* IMAGE */
.main-img {
    width: 220px;
    height: 220px;
    border-radius: 20px;
    border: 6px solid #ffc0cb;
    object-fit: cover;
}

/* BUTTONS */
button {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 20px;
    background-color: #ff8fab;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background-color: #ff5d8f;
}

/* LINKS */
a {
    display: block;
    margin: 10px;
    color: #ff4d88;
    text-decoration: none;
    font-weight: bold;
}

/* FLOATING HEARTS */
.heart {
    position: fixed;
    bottom: -20px;
    color: #ff6fa5;
    font-size: 20px;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(0);
        opacity: 1;
    }
    100% {
        transform: translateY(-100vh);
        opacity: 0;
    }
}

/* MONKEY FILTER */
.monkey {
    filter: contrast(1.2) saturate(1.3);
    transform: scale(1.05);
}

/* SUNGLASSES (FUNNY EFFECT) */
.sunglasses {
    position: absolute;
    width: 120px;
    top: 110px;
    left: 50%;
    transform: translateX(-50%);
}

/* BYE PAGE */
.fade {
    animation: fadeOut 3s forwards;
}

@keyframes fadeOut {
    from {opacity:1;}
    to {opacity:0;}
}
</style>
</head>

<body>

<!-- LANDING -->
<div id="landing" class="container">
    <h2>just a question… 🐵💗</h2>

    <div style="position:relative;">
        <img src="Me.jpeg" class="main-img monkey">
        <img src="https://i.imgur.com/3GvwNBf.png" class="sunglasses">
    </div>

    <p>be honest… do you still love me? 😗</p>

    <button onclick="yesClicked()">Yes, I still do 💗</button>
    <button onclick="noClicked()">No, I’ve moved on 💔</button>
</div>

<!-- YES PAGE -->
<div id="yesPage" class="container hidden">
    <h2>Yay… I knew it 😌💗</h2>

    <img src="YOUR_PHOTO.jpg" class="main-img">

    <p>okay then… don’t be shy 😏</p>

    <a href="tel:639XXXXXXXXX">📞 Call me</a>
    <a href="https://m.me/YOURUSERNAME">💬 Message me</a>
    <a href="mailto:YOUREMAIL@gmail.com">📧 Email me</a>

    <p>i’ll be waiting… maybe with snacks 🍟💗</p>
</div>

<!-- NO PAGE -->
<div id="noPage" class="container hidden">
    <h2 id="byeText">bye… bye 💔</h2>
    <img src="https://media.giphy.com/media/OPU6wzx8JrHna/giphy.gif" width="200">
</div>

<script>

/* BLOCK REOPEN */
if (localStorage.getItem("blocked") === "true") {
    document.body.innerHTML = "<h2 style='margin-top:100px;'>Access denied 💔</h2>";
}

/* HEARTS GENERATOR */
function createHearts() {
    for (let i = 0; i < 30; i++) {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💗";

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (3 + Math.random() * 3) + "s";
        heart.style.fontSize = (15 + Math.random() * 20) + "px";

        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }
}

/* YES */
function yesClicked() {
    document.getElementById("landing").classList.add("hidden");
    document.getElementById("yesPage").classList.remove("hidden");

    setInterval(createHearts, 500);
}

/* NO */
function noClicked() {
    document.getElementById("landing").classList.add("hidden");
    document.getElementById("noPage").classList.remove("hidden");

    setTimeout(() => {
        document.getElementById("byeText").classList.add("fade");
    }, 1000);

    localStorage.setItem("blocked", "true");
}

</script>

</body>
</html>
