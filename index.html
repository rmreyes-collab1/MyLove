<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>just a question 💗</title>

<style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: #ffd6e7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* MAIN WRAPPER */
.wrapper {
    width: 100%;
    max-width: 400px;
    text-align: center;
}

/* CARD STYLE */
.card {
    background: #ffeaf4;
    padding: 20px;
    border-radius: 25px;
    box-shadow: 0 8px 20px rgba(255, 100, 150, 0.2);
}

/* TITLE */
.title {
    font-size: 26px;
    font-weight: bold;
    color: #ff5d8f;
}

/* IMAGE */
.img {
    width: 220px;
    height: 220px;
    border-radius: 20px;
    border: 5px solid #ffb6c1;
    object-fit: cover;
    margin: 15px 0;
}

/* TEXT */
.text {
    font-size: 16px;
    color: #ff4d88;
}

/* BUTTONS */
.btn {
    display: inline-block;
    padding: 12px 18px;
    margin: 10px 5px;
    border-radius: 20px;
    border: none;
    font-size: 15px;
    cursor: pointer;
}

.yes {
    background: #ff8fab;
    color: white;
}

.no {
    background: #fff;
    color: #ff5d8f;
    border: 2px solid #ff8fab;
}

/* LINKS */
.link {
    display: block;
    margin: 10px;
    padding: 12px;
    background: white;
    border-radius: 15px;
    text-decoration: none;
    color: #ff4d88;
    box-shadow: 0 5px 10px rgba(0,0,0,0.05);
}

/* HEARTS */
.heart {
    position: fixed;
    bottom: -10px;
    font-size: 20px;
    animation: floatUp linear forwards;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity:1; }
    100% { transform: translateY(-100vh); opacity:0; }
}

/* HIDDEN */
.hidden { display:none; }

/* BYE FADE */
.fade {
    animation: fadeOut 3s forwards;
}
@keyframes fadeOut {
    to {opacity:0;}
}
</style>
</head>

<body>

<div class="wrapper">

<!-- LANDING -->
<div id="landing" class="card">
    <div class="title">just a question… 💗</div>

    <!-- 🔥 PUT YOUR MONKEY IMAGE HERE -->
    <img src="landing.jpg" class="img">

    <div class="text">be honest… do you still love me? 🥺</div>

    <button class="btn yes" onclick="yesClick()">Yes, I still do 💗</button>
    <button class="btn no" onclick="noClick()">No, I’ve moved on 💔</button>
</div>

<!-- YES PAGE -->
<div id="yesPage" class="card hidden">
    <div class="title">Yay… I knew it 😌💗</div>

    <img src="me.jpg" class="img">

    <div class="text">okay then… don’t be shy 😏</div>

    <a href="tel:09918604535" class="link">📞 Call me</a>
    <a href="https://m.me/unknown0580" class="link">💬 Message me</a>
    <a href="mailto:reamayreyes09@gmail.com" class="link">📧 Email me</a>

    <div class="text">i’ll be waiting… maybe with snacks 🍟💗</div>
</div>

<!-- NO PAGE -->
<div id="noPage" class="card hidden">
    <div id="byeText" class="title">oh… okay 🥺</div>

    <img src="https://media.giphy.com/media/OPU6wzx8JrHna/giphy.gif" width="180">

    <div class="text">bye… bye 💔</div>
</div>

</div>

<script>

/* BLOCK */
if(localStorage.getItem("blocked") === "true"){
    document.body.innerHTML = "<h2 style='text-align:center;'>Access denied 💔</h2>";
}

/* HEARTS */
function spawnHeart(){
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💗";

    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (15 + Math.random()*20) + "px";
    heart.style.animationDuration = (3 + Math.random()*2) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),5000);
}

/* YES */
function yesClick(){
    landing.classList.add("hidden");
    yesPage.classList.remove("hidden");

    let interval = setInterval(spawnHeart, 200);
    setTimeout(()=>clearInterval(interval), 10000);
}

/* NO */
function noClick(){
    landing.classList.add("hidden");
    noPage.classList.remove("hidden");

    setTimeout(()=>{
        byeText.classList.add("fade");
    },1000);

    localStorage.setItem("blocked","true");
}
</script>

</body>
</html>
